<!doctype html>
<!-- Portal share banner (1200x630). Render: see scripts/README in this folder or the comment in og.mjs. -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --rainbow: #ff3d6e, #ff8a3d, #ffd23d, #6dff7a, #33f0d0, #3db4ff, #7a5cff, #e04dff, #ff3d6e; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative; color: #f2f1f4;
    font-family: "IBM Plex Sans", sans-serif;
    background:
      radial-gradient(55% 70% at 0% 0%, rgba(255, 61, 110, .30), transparent 70%),
      radial-gradient(45% 60% at 100% 100%, rgba(51, 240, 208, .16), transparent 70%),
      radial-gradient(40% 50% at 60% 100%, rgba(122, 92, 255, .14), transparent 70%),
      #07070c;
  }
  /* faint tech grid, like the portal */
  body::before { content: ""; position: absolute; inset: 0; opacity: .05;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 40px 40px; }

  .left { position: absolute; left: 64px; top: 0; bottom: 0; width: 364px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 64px; height: 64px; }
  .eyebrow { font: 600 18px "IBM Plex Mono", monospace; letter-spacing: .14em; color: #c9c5d2; margin-top: 30px; }
  h1 { font-size: 78px; line-height: 1; letter-spacing: -.03em; font-weight: 700; margin-top: 14px; }
  p { font-size: 23px; line-height: 1.45; color: #c2bfcb; margin-top: 22px; text-wrap: pretty; }
  .stats { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
  .chip { font: 500 15px "IBM Plex Mono", monospace; padding: 6px 12px; border-radius: 99px; color: #e9e7ee;
    background: linear-gradient(#111019, #111019) padding-box, linear-gradient(90deg, var(--rainbow)) border-box; border: 1.5px solid transparent; }
  .url { position: absolute; left: 64px; bottom: 44px; font: 400 21px "IBM Plex Mono", monospace; color: #9a96a6; }

  .grid { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(3, 224px); grid-auto-rows: 118px; gap: 14px; }
  .card { position: relative; border-radius: 12px; padding: 2px;
    background: conic-gradient(from calc(var(--i) * 40deg), var(--rainbow));
    box-shadow: 0 0 22px rgba(122, 92, 255, .22), 0 10px 30px rgba(0, 0, 0, .45); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
  .card.new::after { content: "NEW"; position: absolute; right: 8px; top: 8px; font: 700 11px "IBM Plex Mono", monospace; letter-spacing: .08em;
    color: #07070c; background: #ffd23d; padding: 2px 6px; border-radius: 5px; }
</style></head>
<body>
  <div class="left">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d6e"/><stop offset=".35" stop-color="#ffd23d"/><stop offset=".65" stop-color="#33f0a0"/><stop offset="1" stop-color="#7a5cff"/></linearGradient></defs>
      <rect width="32" height="32" rx="9" fill="#15141d"/>
      <g fill="url(#g)"><rect x="7" y="7" width="8" height="8" rx="2"/><rect x="17" y="7" width="8" height="8" rx="2"/><rect x="7" y="17" width="8" height="8" rx="2"/><rect x="17" y="17" width="8" height="8" rx="2"/></g>
    </svg>
    <div class="eyebrow">JULIE TOUSSAINT</div>
    <h1>Web apps</h1>
    <p>Nine things I built and host myself. Pick one and open it right in your browser.</p>
    <div class="stats"><span class="chip">9 apps</span><span class="chip">7 with automated tests</span></div>
  </div>
  <div class="url">apps.julietous.workers.dev</div>

  <div class="grid">
    <div class="card" style="--i:0"><img src="../site/img/portfolio.jpg" alt=""></div>
    <div class="card new" style="--i:8"><img src="../site/img/riddlestorm.jpg" alt=""></div>
    <div class="card new" style="--i:1"><img src="../site/img/applytrack.png" alt=""></div>
    <div class="card" style="--i:2"><img src="../site/img/presence-audit.png" alt=""></div>
    <div class="card" style="--i:3"><img src="../site/img/webcave.jpg" alt=""></div>
    <div class="card" style="--i:4"><img src="../site/img/schatkaart.png" alt=""></div>
    <div class="card" style="--i:5"><img src="../site/img/liefvosje.jpg" alt=""></div>
    <div class="card" style="--i:6"><img src="../site/img/maskountability.png" alt=""></div>
    <div class="card" style="--i:7"><img src="../site/img/uptime-city.jpg" alt=""></div>
  </div>
</body></html>
